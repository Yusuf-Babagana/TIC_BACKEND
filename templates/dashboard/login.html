<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TIC Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f0f2f5;
            --card: #fff;
            --border: #e8ecf0;
            --text: #1a1d29;
            --text-secondary: #6b7280;
            --accent: #2463eb;
            --accent-hover: #1a4fbf;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
        }
        html { font-size: 15px; }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-wrap {
            display: flex;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            min-height: 500px;
        }
        .login-side {
            width: 380px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-brand {
            display: flex; align-items: center; gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .login-brand .logo {
            width: 40px; height: 40px; background: var(--accent);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.1rem; color: #fff; flex-shrink: 0;
        }
        .login-brand .brand-text { line-height: 1.2; }
        .login-brand .brand-text strong { display: block; font-size: 1.1rem; font-weight: 700; }
        .login-brand .brand-text small { font-size: 0.7rem; color: var(--text-secondary); font-weight: 500; }
        .login-side h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.2rem; }
        .login-side p.sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.75rem; }

        .login-banner {
            flex: 1;
            background: linear-gradient(135deg, #2463eb 0%, #7c3aed 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: #fff;
            text-align: center;
        }
        .login-banner .icon {
            font-size: 3rem; margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        .login-banner h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .login-banner p { font-size: 0.9rem; opacity: 0.85; max-width: 280px; line-height: 1.6; }

        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: var(--text); margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%; padding: 0.7rem 0.85rem;
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 0.9rem; font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-group input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(36,99,235,0.1);
        }
        .form-group input::placeholder { color: #b0b7c3; }

        button {
            width: 100%; padding: 0.7rem;
            background: var(--accent); color: #fff;
            border: none; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: background .15s;
        }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }

        .error {
            background: #fef2f2; color: var(--danger);
            padding: 0.6rem 0.85rem; border-radius: 8px;
            margin-bottom: 1rem; font-size: 0.85rem;
            border: 1px solid #fecaca;
            display: flex; align-items: center; gap: 0.4rem;
        }

        @media (max-width: 680px) {
            .login-banner { display: none; }
            .login-side { width: 100%; max-width: 400px; margin: 0 auto; }
            .login-wrap { min-height: auto; }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-side">
            <div class="login-brand">
                <div class="logo">T</div>
                <div class="brand-text">
                    <strong>TIC Admin</strong>
                    <small>Management Dashboard</small>
                </div>
            </div>
            <h1>Welcome back</h1>
            <p class="sub">Sign in to your account to continue.</p>
            {% if error %}
                <div class="error">
                    <span>⚠</span>
                    <span>{{ error }}</span>
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Sign In</button>
            </form>
        </div>
        <div class="login-banner">
            <div class="icon">🛡️</div>
            <h2>Admin Portal</h2>
            <p>Manage users, plans, transactions, tailoring orders, and marketing content from one place.</p>
        </div>
    </div>
</body>
</html>
